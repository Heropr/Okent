<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okent - Brand Review</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/brand-review.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="brand-review-container">
    <!-- Header -->
    <header class="brand-header">

2.8032 103.588 47.2497 103.505 50.3457V50.3701C103.18 53.4134 98.7572 53.3794 96.3452 53.4961C89.5696 53.7181 84.3956 53.3062 80.1646 47.501C78.9655 46.0571 77.535 43.7644 75.9126 43.4531C74.1437 43.1625 73.9791 47.2422 73.2651 48.8418C72.1851 52.4161 68.5667 53.3814 65.1411 53.4912C61.0429 53.5941 56.4849 53.0932 55.6909 48.2559C55.1212 44.4986 55.5444 40.5766 55.4712 36.7461C55.5192 30.0848 55.3682 23.3156 55.4712 16.6406C55.4712 14.5514 55.4642 12.4778 55.5054 10.4092C55.5672 7.36813 55.7942 3.91486 58.4233 2.16211C61.0732 0.432413 65.2746 0.430318 68.311 1.05957C73.2834 2.27927 73.0023 5.65482 74.5903 9.47168C75.5285 11.2081 76.7796 10.3383 78.0015 9.06152C79.0312 7.96087 80.146 6.29999 81.2329 5.09863C84.1848 1.5106 88.4067 0.464911 93.0542 0.53125ZM31.2476 18.707C24.854 15.2677 18.4923 20.094 18.6479 27.0527V27.0986C18.6184 33.4966 23.9773 38.2854 30.27 36.1436L30.2681 36.1416C37.5193 33.455 37.9885 22.341 31.2476 18.707Z" fill="#1A1A1A"/>
      </svg>
      <div class="brand-header-divider"></div>
      <h1 class="brand-campaign-name" id="campaignName">Campaign</h1>
    </header>

    <!-- Cards View -->
    <div class="brand-content" id="cardsView">
      <div class="brand-section">
        <h2 class="brand-section-title" id="sectionTitle">Content</h2>
        <div class="brand-cards" id="contentCards">
          <!-- Cards rendered by JS -->
        </div>
      </div>
      <div class="brand-empty" id="emptyState" style="display: none;">
        <p>No content to review</p>
      </div>
    </div>

    <!-- Preview View (hidden by default) -->
    <div class="brand-preview" id="previewView" style="display: none;">
      <!-- Preview Header -->
      <header class="preview-header">
        <button class="preview-back-btn" id="previewBackBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 12L6 8L10 4" stroke="#343637" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Back</span>
        </button>
        <div class="preview-header-label">
          <img id="previewTypeIcon" src="/images/reel-reels-icon.svg" alt="Reel" width="24" height="24">
          <span id="previewTypeLabel">Instagram Reel</span>
        </div>
      </header>

      <!-- Preview Content -->
      <div class="preview-body">
        <div class="preview-area">
          <div class="preview-column">
            <!-- Phone Mockup -->
            <div class="phone-mockup" id="previewPhoneMockup">
              <svg class="phone-mockup-border" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <rect x="0.75" y="0.75" width="99.7%" height="99.7%" rx="29.25" ry="29.25" fill="none" stroke="#DBE0E3" stroke-width="1.5" stroke-dasharray="10 8"/>
              </svg>
              <div class="phone-mockup-empty" id="previewPhoneContent">
                <!-- Reel overlay UI (decorative) -->
                <div class="reel-overlay" id="previewReelOverlay">
                  <!-- Right side actions panel -->
                  <div class="reel-overlay-actions">
                    <div class="reel-actions-group">
                      <div class="reel-action-item">
                        <img src="/images/reel-like.svg" alt="Like">
                      </div>
                      <div class="reel-action-item">
                        <img src="/images/reel-comment.svg" alt="Comment">
                      </div>
                      <div class="reel-action-item">
                        <img src="/images/reel-send.svg" alt="Share">
                      </div>
                      <div class="reel-action-item">
                        <img src="/images/reel-share.svg" alt="Repost">
                      </div>
                    </div>
                    <div class="reel-action-item">
                      <img src="/images/reel-options.svg" alt="Options">
                    </div>
                    <div class="reel-audio-thumb">
                      <img src="https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/90/5e/7e/905e7ed5-a8fa-a8f3-cd06-0028fdf3afaa/199066342442.jpg/60x60bb.jpg" alt="Album">
                    </div>
                  </div>

                  <!-- Bottom section: user info + caption -->
                  <div class="reel-overlay-bottom">
                    <div class="reel-overlay-userinfo">
                      <div class="reel-user-avatar"></div>
                      <div class="reel-user-text-col">
                        <div class="reel-user-name-row">
                          <span class="reel-username">username</span>
                          <img class="reel-verified-badge" src="/images/verified-badge-small.svg" alt="Verified" width="16" height="16">
                        </div>
                        <div class="reel-audio-bar">
                          <img src="/images/arrow-narrow-up-right.svg" alt="Audio" width="14" height="14">
                          <span class="reel-audio-name">BAILE INoLVIDABLE</span>
                        </div>
                      </div>
                    </div>
                    <p class="reel-caption-preview" id="previewCaption"></p>
                  </div>
                </div>
                <!-- Timeline tracker -->
                <div class="reel-timeline-track" id="previewTimelineTrack">
                  <div class="reel-timeline-progress" id="previewTimelineProgress"></div>
                </div>
              </div>
            </div>
            <!-- Bottom Tabs -->
            <div class="reel-tabs">
              <button class="reel-tab active" data-tab="reel">Reel</button>
              <button class="reel-tab" data-tab="cover">Cover Image</button>
            </div>
          </div>
        </div>

        <!-- Right Sidebar (read-only) -->
        <div class="preview-sidebar">
          <div class="preview-sidebar-content">
            <!-- Caption Section (read-only) -->
            <div class="preview-info-section">
              <label class="preview-info-label">Caption</label>
              <div class="preview-caption-text" id="sidebarCaption">No caption provided</div>
            </div>

            <div class="preview-sidebar-divider"></div>

            <!-- File Info -->
            <div class="preview-info-section">
              <label class="preview-info-label">File</label>
              <div class="preview-info-value" id="sidebarFilename">—</div>
            </div>

            <div class="preview-sidebar-divider"></div>

            <!-- Status -->
            <div class="preview-info-section">
              <label class="preview-info-label">Status</label>
              <div class="preview-status-badge" id="sidebarStatus">
                <span class="status-dot"></span>
                <span class="status-text">Pending</span>
              </div>
              <div class="preview-status-actions">
                <button class="status-action-btn approved" id="btnApprove">Approved</button>
                <button class="status-action-btn needs-revision" id="btnNeedsRevision">Needs Revision</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/brand-review.js"></script>
</body>
</html>
